services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store_db}
      MYSQL_USER: ${MYSQL_USER:-store_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-store_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-store_user}:${MYSQL_PASSWORD:-store_password}@db:3306/${MYSQL_DATABASE:-store_db}"
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    volumes:
      # Persistent storage for uploaded product images (local provider)
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../Woocomeerce-Store
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads_data: